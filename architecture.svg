<svg width="1300" height="700" viewBox="0 0 1300 700" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1300" height="700" fill="#ffffff"/>
  <text x="650" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">서울시 자치구 전력 사용량 예측 — 전체 아키텍처</text>

  <!-- Data sources -->
  <rect x="60" y="80" width="230" height="60" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="175" y="106" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">전력 사용량 데이터</text>
  <text x="175" y="125" text-anchor="middle" font-size="11" fill="#64748b">2021~2024 월별 (48개월)</text>

  <rect x="330" y="80" width="230" height="60" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="445" y="106" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">기상 데이터</text>
  <text x="445" y="125" text-anchor="middle" font-size="11" fill="#64748b">기온(일/월별)·강수량</text>

  <line x1="175" y1="140" x2="380" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="445" y1="140" x2="400" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Preprocessing -->
  <rect x="150" y="185" width="500" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="400" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">전처리 (src/data_loader.py)</text>
  <text x="400" y="234" text-anchor="middle" font-size="11.5" fill="#334155">데이터 병합 · CDD/HDD 외생변수 계산 · Train(2021-23)/Test(2024) 분할</text>

  <line x1="400" y1="255" x2="400" y2="285" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Model comparison -->
  <rect x="60" y="285" width="900" height="130" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6"/>
  <text x="80" y="313" font-size="14" font-weight="700" fill="#6b21a8">모델 비교 (src/models.py)</text>

  <rect x="90" y="330" width="180" height="65" rx="7" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.3"/>
  <text x="180" y="358" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Prophet</text>
  <text x="180" y="378" text-anchor="middle" font-size="10.5" fill="#64748b">비교 후 기각</text>

  <rect x="300" y="330" width="180" height="65" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="390" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">SARIMA</text>
  <text x="390" y="370" text-anchor="middle" font-size="10.5" fill="#475569">외생변수 없음</text>
  <text x="390" y="386" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">MAPE 9.72%</text>

  <line x1="480" y1="362" x2="510" y2="362" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="510" y="330" width="200" height="65" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="610" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">SARIMAX + CDD/HDD</text>
  <text x="610" y="370" text-anchor="middle" font-size="10.5" fill="#475569">외생변수 추가</text>
  <text x="610" y="386" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">MAPE 5.65%</text>

  <line x1="710" y1="362" x2="740" y2="362" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="740" y="330" width="200" height="65" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="840" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">+ Grid Search (AIC)</text>
  <text x="840" y="370" text-anchor="middle" font-size="10.5" fill="#1e3a8a">pdq·seasonal_pdq 탐색</text>
  <text x="840" y="386" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="700">MAPE 4.83%</text>

  <line x1="400" y1="415" x2="400" y2="450" stroke="#9333ea" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Refactoring note -->
  <rect x="980" y="285" width="260" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1000" y="313" font-size="13" font-weight="700" fill="#15803d">엔지니어링 개선</text>
  <text x="1000" y="338" font-size="11" fill="#334155">25개 셀 중복 코드를</text>
  <text x="1000" y="356" font-size="11" fill="#334155">src/utils.py</text>
  <text x="1000" y="374" font-size="11" fill="#334155">src/data_loader.py</text>
  <text x="1000" y="392" font-size="11" fill="#334155">src/models.py 로 모듈화</text>

  <!-- Output -->
  <rect x="150" y="450" width="500" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="400" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">최종 모델: SARIMAX + Grid Search</text>
  <text x="400" y="500" text-anchor="middle" font-size="12" fill="#1e3a8a">MAPE 4.83% · RMSE 22,386</text>
  <text x="400" y="518" text-anchor="middle" font-size="10.5" fill="#334155">기존(SARIMA 기본) 대비 약 50% 오차 감소</text>

  <line x1="400" y1="530" x2="400" y2="565" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="150" y="565" width="500" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="600" text-anchor="middle" font-size="12.5" fill="#15803d" font-weight="600">비즈니스 효과: 에너지 구입 비용 약 5~10% 절감 가능성</text>

  <!-- Data source footnote -->
  <text x="650" y="660" text-anchor="middle" font-size="10.5" fill="#94a3b8">※ 실제 자치구 전력 사용 데이터로 개발·검증. 공개 저장소는 보안상 동일 파이프라인을 재현하는 예제 데이터를 사용.</text>
</svg>
